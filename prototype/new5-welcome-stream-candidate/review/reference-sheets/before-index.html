<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Momcozy · 陪伴与记录</title><link rel="stylesheet" href="assets/fonts.css"><link rel="stylesheet" href="assets/google-app.css"><link rel="stylesheet" href="assets/refined-surfaces.css"><link rel="stylesheet" href="assets/onboarding.css"><link rel="stylesheet" href="assets/analysis-cards.css"><link rel="stylesheet" href="assets/home-v01.css"></head>
<body><a class="skip-link" href="#thread">跳到对话</a>
<div class="app" id="app" data-route="home">
<span id="rail-name" hidden></span><span id="rail-count" hidden></span>
<main class="conversation"><header class="topbar"><button class="icon-button mobile-menu" data-action="menu" aria-label="打开菜单"><i data-icon="menu"></i></button><button id="page-back" class="icon-button" data-action="home" aria-label="返回对话" hidden><i data-icon="chevron-left"></i></button><h1 id="native-title" hidden></h1><div class="assistant-identity"><strong>Momcozy</strong><span>陪伴对话</span></div><button id="trend-entry" class="icon-button" data-action="trends" aria-label="查看历史趋势"><i data-icon="chart"></i></button><button id="record-entry" class="icon-button" data-action="records" aria-label="查看记录"><i data-icon="journal"></i></button><button class="family-button" data-action="switch-baby"><span id="baby-avatar"></span><span id="baby-label">宝宝</span><i data-icon="chevron-right"></i></button></header>
<section class="native-page" id="native-page" hidden aria-label="应用页面"></section><nav id="records-dock" class="records-dock" aria-label="快捷记录" hidden><button data-action="quick-edit" data-type="瓶喂母乳"><i data-icon="bottle"></i><span>喂养</span></button><button data-action="quick-edit" data-type="换尿布"><i data-icon="diaper"></i><span>尿布</span></button><button data-action="quick-edit" data-type="体重"><i data-icon="heart"></i><span>体重</span></button><button data-action="quick-edit" data-type="睡眠"><i data-icon="rest"></i><span>睡眠</span></button></nav><div class="thread" id="thread" tabindex="0" aria-label="与育儿助手的对话">
<div class="day-divider"><span id="day-label">今天</span></div>
<section class="welcome" id="welcome"><div class="mascot-wrap"><canvas width="160" height="150" id="mascot" data-companion="ready" aria-label="助手待机"></canvas><span id="role-token" aria-hidden="true" hidden></span><span id="mascot-state" role="status">可以开始了</span></div><div><p class="speaker">育儿助手</p><h1 id="greeting">今天，想和我聊什么？</h1><p class="welcome-copy">喂养、睡眠，或是你的感受。<br>说一句，我们一起记下来。</p></div></section>
<div id="today-wrap"></div><div id="proactive" data-element-id="E-proactive"></div><div id="messages"></div><div id="analysis-task" aria-live="polite"></div><div id="pending-task" data-element-id="E-task"></div>
<div class="thinking" id="thinking" hidden><span class="process-shape" aria-hidden="true"></span><span role="status">正在整理你的话…<small>本机整理 · 尚未保存</small></span><button class="quiet" data-action="cancel-reply">停止</button></div>
</div>
<footer class="composer-area"><div class="floating-tools" aria-label="快捷功能"><button data-action="quick-record-menu"><i data-icon="bottle"></i><span>记一笔</span></button><button data-action="cry"><i data-icon="waveform"></i><span>听哭闹</span></button><button data-action="stool"><i data-icon="camera"></i><span>看便便</span></button></div><div class="voice-hint" id="voice-hint" role="status" hidden></div><div class="composer"><button class="icon-button" data-action="more" aria-label="添加记录或附件"><i data-icon="plus"></i></button><button class="icon-button" id="mode-button" data-action="mode" aria-label="切换到按住说话"><i data-icon="mic"></i></button><button id="voice-button" hidden data-element-id="E-voice" class="voice-button" aria-label="按住说话，松开发送；键盘按住空格"><i data-icon="mic"></i><span>按住说话</span><small>松开后先确认</small></button><form id="chat-form"><label class="sr-only" for="chat-input">发给育儿助手的话</label><textarea id="chat-input" placeholder="聊聊宝宝的今天…" rows="1" maxlength="1000"></textarea><button class="send-button" type="submit" aria-label="发送消息"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 3-7 18-4-7-7-4 18-7ZM10 14 21 3"/></svg></button></form></div></footer>
</main><div class="home-indicator" aria-hidden="true"></div></div>
<dialog id="panel" aria-labelledby="panel-title"><div class="panel-head"><button class="icon-button" id="panel-back" data-action="panel-back" aria-label="返回" hidden><i data-icon="chevron-left"></i></button><h2 id="panel-title"></h2><button class="icon-button" data-action="close-panel" aria-label="关闭面板"><i data-icon="close"></i></button></div><div id="panel-body"></div></dialog>
<div class="toast" id="toast" role="status" hidden><span></span><button hidden></button></div><div class="sr-only" id="announcement" role="status" aria-live="polite"></div>
