name: Prototype integrity

on:
  push:
    branches: [main, codex/internal-test]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen prototype and source hashes
        run: node scripts/verify-repository.cjs
      - name: Preserve historical R27 files against their original tag
        run: git diff --exit-code refs/tags/baseline/B-MOMCOZY-20261022-R27 -- prototype/current docs/baseline-lock.json
      - name: Verify pending Onboarding receipt
        run: node scripts/verify-candidate-receipt.cjs
      - name: Verify R30 Onboarding candidate and evidence
        run: node scripts/verify-onboarding-r30.cjs
      - name: Check R30 Onboarding states and package
        run: |
          node prototype/onboarding-chat-r30-candidate/tests/onboarding-flow.cjs
          node prototype/onboarding-chat-r30-candidate/tests/package-check.cjs
